name: Infrastructure CD

on:
  push:
    branches:
      - main

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # Amazon ECR へログイン
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Base Stack（VPC や ECR リポジトリの作成）
      - name: Deploy Base Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: rd-infra-base
          template: template-base.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM

      # 2. NAT Stack
      - name: Deploy NAT Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: rd-nat-network
          template: template-nat.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM

      # 3. Dockerイメージのビルドと ECR への Push ( /php ディレクトリからビルド )
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rd-cicd-app-repo
          IMAGE_TAG: latest
        run: |
          docker build -f ./app/docker/php/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 4. ECS Stack（クラスタ・ALB・サービスの作成）
      - name: Deploy ECS Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: rd-cicd-ecs
          template: template-ecs.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
